name: Progress Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Progress Badge
        run: |
          python tools/progress.py --badge

      - name: Commit Updated Progress Badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update progress badge [skip ci]"
          file_pattern: "assets/progress.svg"
